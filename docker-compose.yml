services:
  bot:
    build: .
    image: prediction-market-bots
    command: python -m bots.kalshi_crypto.main --series all
    restart: always
    env_file: .env
    environment:
      - TZ=America/Chicago
    volumes:
      - ./data:/app/data

  # Kalshi collectors
  collector-btc:
    image: prediction-market-bots
    command: python scripts/collect_rounds.py --series KXBTC15M --hours 8760
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data

  collector-eth:
    image: prediction-market-bots
    command: python scripts/collect_rounds.py --series KXETH15M --hours 8760
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data

  collector-sol:
    image: prediction-market-bots
    command: python scripts/collect_rounds.py --series KXSOL15M --hours 8760
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data

  collector-xrp:
    image: prediction-market-bots
    command: python scripts/collect_rounds.py --series KXXRP15M --hours 8760
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data

  # Polymarket collectors — 4 coins x 4 durations
  poly-5m-btc:
    image: prediction-market-bots
    command: python scripts/collect_polymarket.py --coin btc --duration 5m --hours 8760
    restart: always
    volumes:
      - ./data:/app/data

  poly-5m-eth:
    image: prediction-market-bots
    command: python scripts/collect_polymarket.py --coin eth --duration 5m --hours 8760
    restart: always
    volumes:
      - ./data:/app/data

  poly-5m-sol:
    image: prediction-market-bots
    command: python scripts/collect_polymarket.py --coin sol --duration 5m --hours 8760
    restart: always
    volumes:
      - ./data:/app/data

  poly-5m-xrp:
    image: prediction-market-bots
    command: python scripts/collect_polymarket.py --coin xrp --duration 5m --hours 8760
    restart: always
    volumes:
      - ./data:/app/data

  poly-15m-btc:
    image: prediction-market-bots
    command: python scripts/collect_polymarket.py --coin btc --duration 15m --hours 8760
    restart: always
    volumes:
      - ./data:/app/data

  poly-15m-eth:

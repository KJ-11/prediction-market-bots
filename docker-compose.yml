# Services on the GCP VM. See OPS.md for operations.
#
# Shared config lives in the x-anchors block at the top:
#   x-bot-base         — runtime for bots (the whale bot today)
#   x-collector-base   — runtime for data collectors (Kalshi + Polymarket)
#   x-default-logging  — 30 MB per container log cap (10 MB × 3 rotated files)
#
# Each service body overrides only what differs (command, service-specific env).

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-bot-base: &bot-base
  build: .
  image: prediction-market-bots
  restart: always
  env_file: .env
  environment:
    - TZ=America/Chicago
  volumes:
    - ./data:/app/data
  logging: *default-logging

x-collector-base: &collector-base
  image: prediction-market-bots
  restart: always
  env_file: .env
  volumes:
    - ./data:/app/data
  logging: *default-logging

services:
  # Active: whale bot, paper mode
  whale:
    <<: *bot-base
    command: python -m bots.kalshi_whale.main
    environment:
      - TZ=America/Chicago
      - PAPER_TRADING=true

  # Crypto bot: paused. Uncomment to run per-round strategy on Kalshi 15m markets.
  # crypto:
  #   <<: *bot-base
  #   command: python -m bots.kalshi_crypto.main --series all

  # Kalshi round collectors: one container per coin, 15m cadence
  collector-btc:
    <<: *collector-base
    command: python scripts/collect_rounds.py --series KXBTC15M --hours 8760

  collector-eth:
    <<: *collector-base
    command: python scripts/collect_rounds.py --series KXETH15M --hours 8760

  collector-sol:
    <<: *collector-base
    command: python scripts/collect_rounds.py --series KXSOL15M --hours 8760

  collector-xrp:
    <<: *collector-base
    command: python scripts/collect_rounds.py --series KXXRP15M --hours 8760

  # Polymarket collectors: 4 coins × 4 durations = 16 containers
  poly-5m-btc:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin btc --duration 5m --hours 8760

  poly-5m-eth:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin eth --duration 5m --hours 8760

  poly-5m-sol:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin sol --duration 5m --hours 8760

  poly-5m-xrp:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin xrp --duration 5m --hours 8760

  poly-15m-btc:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin btc --duration 15m --hours 8760

  poly-15m-eth:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin eth --duration 15m --hours 8760

  poly-15m-sol:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin sol --duration 15m --hours 8760

  poly-15m-xrp:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin xrp --duration 15m --hours 8760

  poly-1h-btc:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin btc --duration 1h --hours 8760

  poly-1h-eth:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin eth --duration 1h --hours 8760

  poly-1h-sol:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin sol --duration 1h --hours 8760

  poly-1h-xrp:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin xrp --duration 1h --hours 8760

  poly-4h-btc:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin btc --duration 4h --hours 8760

  poly-4h-eth:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin eth --duration 4h --hours 8760

  poly-4h-sol:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin sol --duration 4h --hours 8760

  poly-4h-xrp:
    <<: *collector-base
    command: python scripts/collect_polymarket.py --coin xrp --duration 4h --hours 8760
